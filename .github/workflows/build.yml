name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "正式发布的版本标签，例如 v0.1.0；留空只做测试构建"
        required: false

# 同一分支只保留最新一次，避免旧构建覆盖测试版安装包
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen libarchive
      - name: Bootstrap
        run: ./scripts/bootstrap.sh
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project MacUnZip.xcodeproj -scheme MacUnZip -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning: .*(MainActor|Sendable)|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project MacUnZip.xcodeproj -scheme MacUnZip -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO test | tee test.log | grep -E "error:|Test Case .*(passed|failed)|TEST" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Package DMG
        run: |
          set -o pipefail
          # 没有开发者证书时使用临时签名（ad-hoc），仅用于本机测试
          xcodebuild -project MacUnZip.xcodeproj -scheme MacUnZip -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            build | tee package.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" package.log
          APP=build/Build/Products/Release/MacUnZip.app
          codesign --verify --deep --strict "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname MacUnZip -srcfolder dmg -ov -format UDZO MacUnZip.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MacUnZip-dmg
          path: MacUnZip.dmg
      - name: Publish test build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag 2>/dev/null || true
          gh release create test-build MacUnZip.dmg --prerelease --target "$GITHUB_SHA" \
            --title "测试版（$(git rev-parse --short HEAD)）" \
            --notes "临时签名的测试版本，仅用于本机安装测试。首次打开请在访达中右键 MacUnZip →「打开」。"
      # 正式版本：手动运行并填写 release_tag。先建草稿上传附件，重新下载核对哈希后再公开
      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PLIST=build/Build/Products/Release/MacUnZip.app/Contents/Info.plist
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          test "$APP_VERSION" = "$VERSION" || { echo "标签 $VERSION 与应用版本 $APP_VERSION 不一致"; exit 1; }
          if gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "$TAG 已公开发布，拒绝覆盖"; exit 1
          fi
          gh release delete "$TAG" --yes 2>/dev/null || true
          ASSET="MacUnZip-$VERSION.dmg"
          cp MacUnZip.dmg "$ASSET"
          shasum -a 256 "$ASSET" > SHA256SUMS.txt
          gh release create "$TAG" "$ASSET" SHA256SUMS.txt --draft --target "$GITHUB_SHA" \
            --title "MacUnZip $VERSION" --notes-file "docs/releases/$TAG.md"
          mkdir check && gh release download "$TAG" -D check
          (cd check && shasum -a 256 -c SHA256SUMS.txt)
          gh release edit "$TAG" --draft=false --latest
          echo "已发布 ${TAG}（${GITHUB_SHA}）"
