[package]
name = "muz-core"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto", "bzip2", "zstd", "lzma", "time"] }
sevenz-rust2 = { version = "0.23", features = ["compress", "aes256"] }
unrar = "0.5"
tar = "0.4"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
bzip2 = "0.6"
zstd = "0.14"
walkdir = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
